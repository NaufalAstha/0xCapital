<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xTerminal</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="terminal-panel" id="terminal">
        <div class="terminal-header" id="terminalHeader">
            <div class="window-buttons">
                <span class="btn btn-close"></span>
                <span class="btn btn-minimize"></span>
                <span class="btn btn-maximize"></span>
            </div>
            <span class="terminal-title">bash -- 80x24</span>
            <div></div>
        </div>

        <div class="terminal-body">
            <p><span class="prompt">user@localhost:~$</span> echo "Panel terminal siap digunakan!"</p>
            <p>Panel terminal siap digunakan!</p>
            <p><span class="prompt">user@localhost:~$</span> <span id="cursor">_</span></p>
        </div>
    </div>
<script src="js/widgets.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <Div class="sidebar">
        <aside>
            <div class="logo" id="logo">0xCapital</div>
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="../page/trade.html">Trade</a></li>
                <li><a href="../page/jurnal.html">Jurnal</a></li>
                <li><a href="#">Performance</a></li>
                <li><a href="#">Calculator</a></li>
                <li><a href="#">Dictionary</a></li>
                <li><a href="#">Jesse AI</a></li>
            </ul>
            <button type="button" id="account-btn">
                <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png" alt="photo-profile">
                <p>Account</p>
            </button>
        </aside>
    </Div>

    <div class="main-content">
        <div class="changeSymbol">
            <button onclick="changeSymbol('OANDA:XAUUSD')">XAUUSD</button>
            <button onclick="changeSymbol('OANDA:BCOUSD')">DXY</button>
        </div>

        <iframe 
            id="tradingview_iframe"
            src="https://s.tradingview.com/widgetembed/?symbol=NASDAQ%3AAAPL&interval=D&theme=dark" 
            style="width: 100%; height: 100%; border: none; flex-grow: 1;"
            title="TradingView Chart">
        </iframe>
    </div>

    <script>
        function changeSymbol(newSymbol) {
            const iframe = document.getElementById('tradingview_iframe');
            const encodedSymbol = encodeURIComponent(newSymbol);

            iframe.src = `https://s.tradingview.com/widgetembed/?symbol=${encodedSymbol}&interval=D&theme=dark&hidesidetoolbar=0`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xCapital - Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <Div class="sidebar">
        <aside>
            <div class="logo" id="logo">0xCapital</div>
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="page/trade.html">Trade</a></li>
                <li><a href="page/jurnal.html">Jurnal</a></li>
                <li><a href="#">Performance</a></li>
                <li><a href="#">Calculator</a></li>
                <li><a href="#">Dictionary</a></li>
                <li><a href="#">Jesse AI</a></li>
            </ul>
            <button type="button" id="account-btn">
                <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png" alt="photo-profile">
                <p>Account</p>
            </button>
        </aside>
    </Div>

    <div class="main-content">
        <div class="topbar">
            <div class="container">
                <label for="deposite">Deposite : </label>
                <input type="number" placeholder="input your deposite" id="deposite">
            </div>

            <div class="container">
                <label for="pnl">Profit / Loss</label>
                <input type="number" placeholder="input your trade result" id="pnl">
            </div>

            <div class="container">
                <p class="headline">Equity :</p>
                <span id="equity" class="equityValue">$1000</span>
            </div>
        </div>

        <p>Welcome To 0xCapital</p>
    </div>

    <script src="../script.js"></script>
</body>
</html>
